---
- name: Run Node Exporter container
  docker_container:
    name: node-exporter
    image: "prom/node-exporter:{{ node_exporter_version }}"
    restart_policy: always
    recreate: no
    networks:
      - name: "{{ monitoring_network_name }}"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/rootfs:ro"
    pid_mode: "host"
    memory: "{{ node_exporter_memory_limit }}"
    cpus: "{{ node_exporter_cpu_limit }}"

- name: Run cAdvisor container
  docker_container:
    name: cadvisor
    image: "ghcr.io/google/cadvisor:{{ cadvisor_version }}"
    restart_policy: always
    recreate: no
    networks:
      - name: "{{ monitoring_network_name }}"
    command:
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.service"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/dev/disk:/dev/disk:ro"
    privileged: true
    devices:
      - "/dev/kmsg:/dev/kmsg"
    memory: "{{ cadvisor_memory_limit }}"
    cpus: "{{ cadvisor_cpu_limit }}"
