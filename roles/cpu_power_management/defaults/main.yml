---
# CPU 부스트 비활성화 설정
# AMD Ryzen 미니 PC에서 팬 소음 감소를 위해 CPU 부스트를 비활성화합니다.

# CPU 부스트 활성화 여부 (false = 비활성화)
cpu_boost_enabled: false

# GRUB 커널 파라미터 기본값
# AMD P-State는 BIOS CPPC 미지원으로 사용 불가, 기본값 유지
grub_cmdline_linux_default: "quiet splash"

# Systemd 서비스 설정
cpu_boost_service_name: disable-cpu-boost
cpu_boost_service_description: "Disable CPU Boost for stable temperatures"

# CPU boost 확인 경로
cpu_boost_sysfs_path: /sys/devices/system/cpu/cpufreq/boost

# GRUB 설정 파일 경로
grub_config_file: /etc/default/grub
