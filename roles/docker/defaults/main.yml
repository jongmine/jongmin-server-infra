---
# Docker Role Default Variables

# Docker Network Name
docker_network_name: "jongmin-net"

# Docker daemon log rotation
# Alloy reads Docker JSON logs. Bound file size so cursor drift cannot replay
# unbounded historical logs into Loki.
docker_log_driver: "json-file"
docker_log_max_size: "50m"
docker_log_max_file: "5"

# Glances Settings
glances_image: "nicolargo/glances:latest"
glances_port: 61208
glances_polling_interval: 5 # seconds

# Portainer Settings
portainer_image: "portainer/portainer-ce:latest"
portainer_port: 9000

# Required Variables (must be defined in group_vars)
# - domain_name
