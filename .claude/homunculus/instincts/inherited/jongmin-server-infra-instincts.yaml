# Jongmin Server Infra Workflow Observability Dashboard And Alert Update

## Action

Follow the observability-dashboard-and-alert-update workflow:
1. Edit or add JSON files under roles/monitoring/files/dashboards/ (e.g., apm-dashboard.json, datastore-dashboard.json, jvm-hikari-dashboard.json)
2. Update alert rules in roles/monitoring/templates/alert_rules_sallang.yml.j2
3. Update Grafana dashboard deployment tasks in roles/monitoring/tasks/grafana_dashboards.yml
4. Update documentation (e.g., docs/MONITORING_GUIDE.md, docs/observability/monitoring-architecture-and-policy.md) as needed

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: roles/monitoring/files/dashboards/*.json, roles/monitoring/templates/alert_rules_sallang.yml.j2, roles/monitoring/tasks/grafana_dashboards.yml

